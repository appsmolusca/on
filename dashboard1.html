<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Molusca | Executive View (Yearly)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }

        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Badge Status */
        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.02em;
        }
        
        /* Animasi Kedip Urgent */
        @keyframes urgent-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
        .urgent-blink {
            animation: urgent-pulse 1.5s ease-in-out infinite;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        
        /* Header Section Divider */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 3rem 0 1.5rem 0;
        }
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
        }
        
        /* Shimmer Loading Skeleton */
        .skeleton {
            background: linear-gradient(110deg, #f1f5f9 8%, #e2e8f0 18%, #f1f5f9 33%);
            border-radius: 8px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }
        .dark .skeleton {
            background: linear-gradient(110deg, #27272a 8%, #3f3f46 18%, #27272a 33%);
        }
        @keyframes shine { to { background-position-x: -200%; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-zinc-100 pb-16 text-[13px]" onload="initApp()" oncontextmenu="return false;"> 

<div class="max-w-[1200px] mx-auto p-4 md:p-6 lg:p-8 space-y-6">
    
    <!-- ============================================== -->
    <!-- HEADER -->
    <!-- ============================================== -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 md:mb-10 mt-2">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">

        <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-xl text-[11px] shadow-sm font-semibold transition-colors">

    <!-- ============================================== -->
    <!-- WIDGET SUMMARY EKSEKUTIF (3D & PRODUKSI) -->
    <!-- ============================================== -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-2">
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm flex flex-col justify-center h-[130px] relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 opacity-[0.03] dark:opacity-5 pointer-events-none">
                <i class="ph-fill ph-scales text-8xl"></i>
            </div>
            <div class="flex items-center gap-2 mb-2 text-amber-500">
                <i class="ph-fill ph-scales text-xl"></i>
                <span class="text-[11px] font-bold uppercase tracking-widest text-slate-500 dark:text-zinc-400">Total Gramasi (Tahun Ini)</span>
            </div>
            <p class="text-3xl md:text-4xl font-black text-slate-800 dark:text-zinc-100 tracking-tighter relative z-10"><span id="gramasiYearUI"><span class="skeleton inline-block w-24 h-10 rounded"></span></span><span class="text-sm font-bold text-slate-400 ml-1">gr</span></p>
        </div>

        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm flex flex-col h-[130px] relative overflow-hidden">
             <div class="absolute -right-4 -bottom-4 opacity-[0.03] dark:opacity-5 pointer-events-none">
                <i class="ph-fill ph-engine text-8xl"></i>
            </div>
            <div class="flex items-center gap-2 mb-3 text-rose-500">
                <i class="ph-fill ph-engine text-xl animate-pulse"></i>
                <span class="text-[11px] font-bold uppercase tracking-widest text-slate-500 dark:text-zinc-400">Mesin Aktif Saat Ini</span>

            <div id="mesinLiveUI" class="flex flex-wrap gap-2 overflow-y-auto mt-0.5 relative z-10">

    <!-- ============================================== -->
    <!-- GRAFIK PRODUKTIVITAS GLOBAL (12 BULAN) -->
    <!-- ============================================== -->
    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col mb-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-[14px] font-bold flex items-center gap-2 text-slate-800 dark:text-zinc-100">
                <i class="ph-bold ph-trend-up text-blue-500"></i> Produktivitas Global (<span id="yearLabel">Tahun Ini</span>)
            </h2>
        </div>

    <!-- ============================================== -->
    <!-- BAGIAN 1: DIVISI KONTEN -->

        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-video-camera text-rose-500"></i> Divisi Konten

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
        <!-- 1. Target Deadline Kreator -->
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">

                <span class="text-[10px] bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400 font-bold px-2 py-0.5 rounded border border-blue-200 dark:border-blue-500/20" id="creatorTaskCount">0</span>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorTasksContainer">
                <div class="skeleton h-16 w-full"></div><div class="skeleton h-16 w-full"></div>
            </div>
        </div>

        <!-- 2. Laporan Harian Kreator -->
        <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl p-5 shadow-sm transition-colors flex flex-col h-[320px]">
            <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                <h3 class="text-[13px] font-bold flex items-center gap-1.5 text-slate-800 dark:text-zinc-100"><i class="ph-bold ph-files text-emerald-500"></i> Laporan (2 Hari Terakhir)</h3>
            </div>
            <div class="space-y-2.5 overflow-y-auto pr-1" id="creatorReportsContainer">

    <!-- ============================================== -->

    <div class="section-header after:bg-slate-200 dark:after:bg-zinc-800">
        <h2 class="text-base md:text-lg font-black text-slate-900 dark:text-white tracking-wide uppercase flex items-center gap-2">
            <i class="ph-fill ph-paint-brush-broad text-purple-500"></i> Divisi Desain
        </h2>
    </div>

    <div>
        <div class="flex items-center justify-between mb-4">
            <p class="text-[11px] md:text-xs text-slate-500 dark:text-zinc-400 font-medium bg-slate-100 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-lg inline-flex items-center gap-2">
                <i class="ph-fill ph-info text-blue-500"></i> Menampilkan task berjalan yang belum selesai
            </p>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6" id="teamTasksContainer">
            <div class="bg-white dark:bg-zinc-900 p-5 rounded-[24px] border border-slate-200 dark:border-zinc-800"><div class="skeleton h-6 w-1/2 mb-4"></div><div class="skeleton h-20 w-full mb-3"></div><div class="skeleton h-20 w-full"></div></div>
            <div class="bg-white dark:bg-zinc-900 p-5 rounded-[24px] border border-slate-200 dark:border-zinc-800"><div class="skeleton h-6 w-1/2 mb-4"></div><div class="skeleton h-20 w-full mb-3"></div></div>
            <div class="bg-white dark:bg-zinc-900 p-5 rounded-[24px] border border-slate-200 dark:border-zinc-800 hidden sm:block"><div class="skeleton h-6 w-1/2 mb-4"></div><div class="skeleton h-20 w-full mb-3"></div><div class="skeleton h-20 w-full"></div></div>
            <div class="bg-white dark:bg-zinc-900 p-5 rounded-[24px] border border-slate-200 dark:border-zinc-800 hidden lg:block"><div class="skeleton h-6 w-1/2 mb-4"></div><div class="skeleton h-20 w-full mb-3"></div></div>
        </div>
    </div>
    
</div>

<script>
    // Mencegah Inspect Element
    document.addEventListener('keydown', function(e) { if (e.ctrlKey && ['c','u','s','p','a'].includes(e.key.toLowerCase())) e.preventDefault(); });

    // ==========================================
    // SISTEM LOGIN & ID SPREADSHEET
    // ==========================================
    const SPREADSHEET_ID = '1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI';
    const userName = localStorage.getItem('moluscaUser');
    
    function logout() {
        if(confirm("Yakin ingin keluar dari workspace?")) {
            localStorage.clear();
            window.location.href = 'index.html'; 
        }
    }

    // Tanggal Hari Ini
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);
    const loadingIndicator = document.getElementById('loadingIndicator');
    const statusDot = document.getElementById('statusDot');
    
    const currentYear = new Date().getFullYear();
    document.getElementById('yearLabel').innerText = `Tahun ${currentYear}`;

    // ==========================================
    // FUNGSI TARIK DATA LIVE DARI GOOGLE SHEETS (GVIZ)
    // ==========================================
    async function fetchSheetData(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}&t=${Date.now()}`;
        try {
            const response = await fetch(url, { cache: "no-store" });
            const text = await response.text();
            const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const json = JSON.parse(jsonStr);
            
            const cols = json.table.cols.map(c => c ? c.label : '').map(h => h.trim());
            const rows = json.table.rows.map(r => {
                let row = {};
                r.c.forEach((c, i) => {
                    if (cols[i]) {
                        row[cols[i]] = c ? (c.f !== undefined && c.f !== null ? c.f : c.v) : '';
                    }
                });
                return row;
            });
            return rows;
        } catch (error) {
            console.error(`Gagal memuat sheet ${sheetName}:`, error);
            return [];
        }
    }

    // ==========================================
    // UTILS FORMAT & BADGE
    // ==========================================
    function parseDateToObj(dateStr) {
        if (!dateStr) return null;
        let str = String(dateStr).trim();
        if (/^\d{13}$/.test(str)) return new Date(parseInt(str));
        if (str.startsWith('Date(')) {
            const match = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) return new Date(match[1], match[2], match[3]);
        }
        let d = new Date(str);
        if (!isNaN(d)) return d;
        let parts = str.split(/[-\/]/);
        if (parts.length === 3) {
            const cleanYear = parts[0].length === 4 ? parts[0] : parts[2].split(/[ T]/)[0];
            const cleanMonth = parseInt(parts[1]) - 1;
            const cleanDay = (parts[0].length === 4 ? parts[2] : parts[0]).split(/[ T]/)[0];
            return new Date(cleanYear, cleanMonth, cleanDay);
        }
        return null;
    }

    function getStatusBadge(status) {
        const s = (status || '').toLowerCase();
        if (s.includes('final') || s.includes('selesai')) return `<span class="badge bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-400 border dark:border-emerald-500/30">Selesai</span>`;
        if (s.includes('revisi') || s.includes('to-do')) return `<span class="badge bg-amber-50 text-amber-600 border-amber-200 dark:bg-amber-500/15 dark:text-amber-400 border dark:border-amber-500/30">${status}</span>`;
        return `<span class="badge bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/15 dark:text-blue-400 border dark:border-blue-500/30">${status || 'Lagi Dikerjain'}</span>`;
    }

    function getPriorityBadge(priority) {
        if ((priority || "").toLowerCase().includes('urgent')) {
            return `<span class="urgent-blink bg-red-50 text-red-600 border-red-200 dark:bg-red-500/15 dark:text-red-400 border dark:border-red-500/30 uppercase"><i class="ph-fill ph-warning-circle"></i> Urgent</span>`;
        }
        return ``;
    }
    
    function formatShortDate(dateStr) {
        let d = parseDateToObj(dateStr);
        if (d && !isNaN(d.getTime())) {
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }
        return String(dateStr).substring(0, 10);
    }

    // ==========================================
    // FUNGSI UTAMA LOAD DATA
    // ==========================================
    async function initApp() {
        if (userName) { document.getElementById('headerName').innerText = `| ${userName}`; }

        loadingIndicator.classList.remove('hidden');
        statusDot.classList.replace('bg-emerald-500', 'bg-amber-500');

        // Fetch semua data, termasuk tasks_3d untuk Widget
        const [rawTasks, rawCreatorTasks, rawCreatorReports, rawTasks3d] = await Promise.all([
            fetchSheetData('tasks'),
            fetchSheetData('creator_tasks'),
            fetchSheetData('creator_reports'),
            fetchSheetData('tasks_3d')
        ]);

        // ==================================
        // Proses Widget 3D & Produksi (Tahunan)
        // ==================================
        let totalGramasiTahunIni = 0;
        let mesinAktifSekarang = new Set();

        (rawTasks3d || []).forEach(t => {
            let dObj = parseDateToObj(t.dateStr || t.Timestamp || t.id);
            let isCurrentYear = dObj && dObj.getFullYear() === currentYear;

            // 1. Hitung Gramasi (Hanya yang tahun ini)
            if(isCurrentYear) {
                let gramasiStr = String(t.gramasi || '').replace(/[^0-9.]/g, '');
                let gramasiVal = parseFloat(gramasiStr);
                if(!isNaN(gramasiVal)) totalGramasiTahunIni += gramasiVal;
            }

            // 2. Cek Mesin Aktif (Status Live, bukan Final/Selesai)
            let statusStr = String(t.status || '').toLowerCase();
            let isActive = !statusStr.includes('selesai') && !statusStr.includes('final');
            let msnRaw = String(t.mesin || '').trim();
            let validMesin = msnRaw && msnRaw !== '-' && msnRaw.toLowerCase() !== 'undefined' && msnRaw.toLowerCase() !== 'null';
            
            if (isActive && validMesin) {
                msnRaw.split(',').forEach(m => mesinAktifSekarang.add(m.trim()));
            }
        });

        // Update UI Widget 3D
        document.getElementById('gramasiYearUI').innerText = totalGramasiTahunIni.toLocaleString('id-ID');
        
        let mesinLiveHtml = '';
        if (mesinAktifSekarang.size === 0) {
            mesinLiveHtml = '<p class="text-[11px] font-medium text-slate-400 mt-2">Mesin sedang standby (Kosong).</p>';
        } else {
            mesinLiveHtml = Array.from(mesinAktifSekarang).map(m => `
                <span class="bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400 border border-rose-200 dark:border-rose-500/20 px-2 py-1 rounded-md text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 shadow-sm">
                    <i class="ph-fill ph-rocket"></i> ${m}
                </span>
            `).join('');
        }
        document.getElementById('mesinLiveUI').innerHTML = mesinLiveHtml;


        // ==================================
        // Proses Divisi Konten
        // ==================================
        const activeCreatorTasks = rawCreatorTasks.filter(t => {
            const status = String(t.isCompleted).trim().toUpperCase();
            return status !== "TRUE" && status !== "SELESAI";
        });

        document.getElementById('creatorTaskCount').innerText = activeCreatorTasks.length;
        
        if(activeCreatorTasks.length === 0) {
            document.getElementById('creatorTasksContainer').innerHTML = `<p class="text-xs text-slate-400 text-center mt-10 font-medium">Tidak ada tugas kreator berjalan</p>`;
        } else {
            const cTaskHtml = activeCreatorTasks.map(c => `
                <div class="p-3 bg-slate-50 dark:bg-zinc-900 border-l-[3px] border-l-blue-500 border border-slate-200 dark:border-zinc-800 rounded-xl hover:shadow-sm transition-shadow">
                    <p class="text-[13px] font-semibold text-slate-800 dark:text-zinc-100 line-clamp-2 leading-snug">${c.title || 'Tanpa Judul'}</p>
                    <div class="flex items-center justify-between mt-2.5">
                        <span class="text-[10px] text-slate-500 dark:text-zinc-400 font-semibold bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded flex items-center gap-1"><i class="ph-bold ph-user"></i>${c.client || '-'}</span>
                        <span class="text-[10px] text-blue-600 dark:text-blue-400 font-mono font-bold flex items-center gap-1"><i class="ph-bold ph-clock"></i>${formatShortDate(c.targetDate)}</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('creatorTasksContainer').innerHTML = cTaskHtml;
        }

        if(rawCreatorReports.length === 0) {
             document.getElementById('creatorReportsContainer').innerHTML = `<p class="text-xs text-slate-400 text-center mt-10 font-medium">Belum ada laporan</p>`;
        } else {
            rawCreatorReports.sort((a, b) => {
                let da = parseDateToObj(a.dateVal || a.dateStr || a.Timestamp);
                let db = parseDateToObj(b.dateVal || b.dateStr || b.Timestamp);
                return (db || 0) - (da || 0);
            });
            
            const uniqueDates = [...new Set(rawCreatorReports.map(r => formatShortDate(r.dateStr || r.dateVal)).filter(Boolean))];
            const top2Dates = uniqueDates.slice(0, 2);
            const filteredReports = rawCreatorReports.filter(r => top2Dates.includes(formatShortDate(r.dateStr || r.dateVal)));

            const cReportHtml = filteredReports.map(r => `
                <div class="p-3.5 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-2 opacity-[0.03] dark:opacity-5"><i class="ph-fill ph-quotes text-5xl text-slate-900 dark:text-white"></i></div>
                    <div class="flex items-center gap-2 mb-2 border-b border-slate-200 dark:border-zinc-800 pb-2">
                        <div class="h-6 w-6 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30 flex items-center justify-center text-[11px] font-black">${(r.name || 'U').charAt(0)}</div>
                        <span class="text-[13px] font-extrabold text-slate-800 dark:text-zinc-100">${r.name}</span>
                        <span class="text-[9px] text-slate-500 dark:text-zinc-400 font-mono ml-auto bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 px-1.5 py-0.5 rounded">${formatShortDate(r.dateStr || r.dateVal)}</span>
                    </div>
                    <div class="text-[11px] text-slate-600 dark:text-zinc-400 whitespace-pre-line leading-relaxed font-medium">${r.task || ''}</div>
                </div>
            `).join('');
            document.getElementById('creatorReportsContainer').innerHTML = cReportHtml;
        }

        // ==================================
        // Proses Divisi Desain (Grid Task Aktif)
        // ==================================
        const groupedTasks = {};
        let uncompleted_tasks = rawTasks.filter(t => {
            const s = (t.status || '').toLowerCase();
            const assignee = (t.assignee || '').toLowerCase();
            if(assignee.includes('zalfa') || assignee.includes('teguh')) return false; // Abaikan tim 3D
            return t.assignee && !s.includes('final');
        });

        // Urutkan ID terbaru ke atas
        uncompleted_tasks.sort((a, b) => (parseInt(b.id) || 0) - (parseInt(a.id) || 0));

        uncompleted_tasks.forEach(task => {
            const name = task.assignee.charAt(0).toUpperCase() + task.assignee.slice(1).toLowerCase();
            if(groupedTasks[name] !== undefined) { groupedTasks[name].push(task); } 
            else { groupedTasks[name] = [task]; }
        });

        const teamContainer = document.getElementById('teamTasksContainer');
        let teamHtml = '';

        const colors = [
            'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/20 dark:text-blue-400 dark:border-blue-500/30', 
            'bg-purple-50 text-purple-600 border-purple-200 dark:bg-purple-500/20 dark:text-purple-400 dark:border-purple-500/30', 
            'bg-pink-50 text-pink-600 border-pink-200 dark:bg-pink-500/20 dark:text-pink-400 dark:border-pink-500/30', 
            'bg-indigo-50 text-indigo-600 border-indigo-200 dark:bg-indigo-500/20 dark:text-indigo-400 dark:border-indigo-500/30'
        ];
        let colorIndex = 0;

        if(Object.keys(groupedTasks).length === 0) {
             teamContainer.innerHTML = `<div class="col-span-full p-8 bg-white border border-slate-200 rounded-2xl text-center dark:bg-zinc-900 dark:border-zinc-800"><p class="text-sm font-extrabold text-slate-500 dark:text-zinc-400">Tidak ada tugas aktif.</p></div>`;
        } else {
            for(const [assignee, tasks] of Object.entries(groupedTasks)) {
                const avatarColor = colors[colorIndex % colors.length];
                colorIndex++;

                teamHtml += `
                <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-[20px] p-4 shadow-sm flex flex-col h-[350px]">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 dark:border-zinc-800 pb-3">
                        <div class="flex items-center gap-2">
                            <div class="h-7 w-7 rounded-full ${avatarColor} border flex items-center justify-center font-black text-[13px]">
                                ${assignee.charAt(0)}
                            </div>
                            <h3 class="font-extrabold text-slate-800 dark:text-zinc-100 text-[14px]">${assignee}</h3>
                        </div>
                        <span class="${tasks.length > 0 ? 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-700' : 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20'} text-[10px] font-bold px-2 py-0.5 rounded border">${tasks.length} Task</span>
                    </div>
                    
                    <div class="overflow-y-auto pr-1 flex-1">
                        ${tasks.length > 0 ? `<div class="space-y-2.5">` + tasks.map(t => `
                            <div class="p-3 border rounded-xl transition-all ${t.priority?.toLowerCase() === 'urgent' ? 'bg-red-50 border-red-200 dark:bg-red-500/10 dark:border-red-500/30 hover:border-red-300' : 'bg-slate-50 border-slate-200 dark:bg-zinc-900 dark:border-zinc-800 hover:border-blue-300 dark:hover:border-zinc-600'}">
                                <div class="flex justify-between items-start mb-1.5">
                                    <span class="text-[9px] font-bold text-slate-500 dark:text-zinc-400 bg-white border-slate-200 dark:bg-zinc-800 border dark:border-zinc-700 px-1.5 py-0.5 rounded">${t.joCode \vert{}\vert{} '-'}</span>${getStatusBadge(t.status)}
                                </div>
                                <p class="text-[12.5px] font-bold text-slate-800 dark:text-zinc-100 leading-snug mb-2">${t.title || 'Tanpa Judul'}</p>
                                <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200/60 dark:border-zinc-700/50">
                                    <span class="text-[9px] text-slate-500 dark:text-zinc-400 font-semibold flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${formatShortDate(t.dateStr)}</span>${getPriorityBadge(t.priority)}
                                </div>
                            </div>
                        `).join('') + `</div>` : `
                            <div class="flex flex-col items-center justify-center h-full text-center pb-6 opacity-70">
                                <i class="ph-fill ph-check-circle text-5xl text-emerald-500/70 mb-2 drop-shadow-sm"></i>
                                <p class="text-[13px] font-extrabold text-slate-700 dark:text-zinc-300">Semua Clear!</p>
                                <p class="text-[11px] font-medium text-slate-500 dark:text-zinc-500 mt-0.5">Kerjaan sudah beres.</p>
                            </div>
                        `}
                    </div>
                </div>
                `;
            }
            teamContainer.innerHTML = teamHtml;
        }

        loadingIndicator.classList.add('hidden');
        statusDot.classList.replace('bg-amber-500', 'bg-emerald-500');

        // Render Grafik TAHUNAN
        renderYearlyChart(rawTasks, rawCreatorTasks, rawTasks3d);
    }

    // ==========================================
    // LOGIC GRAFIK TAHUNAN (12 BULAN)
    // ==========================================
    let productivityChart;

    function getYearlyData(tasksArray, dateField, statusField, successStatuses) {
        let monthlyCounts = new Array(12).fill(0); // Index 0-11 untuk Jan-Des
        
        (tasksArray || []).forEach(t => {
            let status = String(t[statusField] || '').toLowerCase();
            let isSuccess = successStatuses.some(s => status.includes(s));
            
            if(isSuccess) {
                let dStr = t[dateField] || t.Timestamp || t.dateStr || t.id;
                let d = parseDateToObj(dStr);
                
                if(d && !isNaN(d.getTime())) {
                    if (d.getFullYear() === currentYear) {
                        monthlyCounts[d.getMonth()]++;
                    }
                }
            }
        });
        return monthlyCounts;
    }

    function renderYearlyChart(rawTasks, rawCreatorTasks, rawTasks3d) {
        const chartLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];

        // Ambil Data Selesai per bulan untuk tahun ini
        const dataDesain = getYearlyData(rawTasks, 'dateStr', 'status', ['final', 'selesai']);
        const dataKonten = getYearlyData(rawCreatorTasks, 'targetDate', 'isCompleted', ['true', '1', 'selesai']);
        const data3D = getYearlyData(rawTasks3d, 'endTime', 'status', ['selesai']);

        const ctx = document.getElementById('productivityChart').getContext('2d');
        Chart.defaults.font.family = 'Inter';
        Chart.defaults.font.size = 11;

        if(productivityChart) productivityChart.destroy();

        // Menggunakan line chart dengan fill agar terlihat elegan untuk laporan tahunan
        productivityChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: 'Desain Grafis',
                        data: dataDesain,
                        borderColor: '#3b82f6', // blue-500
                        backgroundColor: 'rgba(59, 130, 246, 0.08)',
                        borderWidth: 2.5,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#3b82f6',
                        pointBorderWidth: 2,
                        pointRadius: 3
                    },
                    {
                        label: 'Konten Kreator',
                        data: dataKonten,
                        borderColor: '#f43f5e',  // rose-500
                        backgroundColor: 'rgba(244, 63, 94, 0.08)',
                        borderWidth: 2.5,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#f43f5e',
                        pointBorderWidth: 2,
                        pointRadius: 3
                    },
                    {
                        label: '3D & Produksi',
                        data: data3D,
                        borderColor: '#10b981',  // emerald-500
                        backgroundColor: 'rgba(16, 185, 129, 0.08)',
                        borderWidth: 2.5,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#10b981',
                        pointBorderWidth: 2,
                        pointRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', align: 'end', labels: { boxWidth: 10, usePointStyle: true, color: '#475569', font: { weight: '600' } } },
                    tooltip: { backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1, titleColor: '#f8fafc', bodyColor: '#cbd5e1', padding: 10, cornerRadius: 8 }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false }, border: { dash: [4, 4] } },
                    x: { grid: { display: false, drawBorder: false } }
                }
            }
        });
        updateChartTheme();
    }

    // ==========================================
    // DARK MODE TOGGLE & CHART UPDATE
    // ==========================================
    const htmlTag = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    let isDark = false; 

    function updateChartTheme() {
        if(!productivityChart) return;
        const textColor = isDark ? '#e2e8f0' : '#475569';
        const gridColor = isDark ? '#27272a' : '#f1f5f9';
        const pointBg = isDark ? '#09090b' : '#ffffff';

        productivityChart.options.plugins.legend.labels.color = textColor;
        productivityChart.options.scales.y.grid.color = gridColor;
        productivityChart.options.scales.x.ticks.color = textColor;
        productivityChart.options.scales.y.ticks.color = textColor;
        
        // Update point backgrounds to match theme
        productivityChart.data.datasets.forEach(dataset => {
            dataset.pointBackgroundColor = pointBg;
        });
        
        productivityChart.update();
    }

    themeToggleBtn.addEventListener('click', () => {
        isDark = !isDark;
        if(isDark) {
            htmlTag.classList.add('dark');
            themeIcon.classList.remove('ph-moon');
            themeIcon.classList.add('ph-sun');
        } else {
            htmlTag.classList.remove('dark');
            themeIcon.classList.remove('ph-sun');
            themeIcon.classList.add('ph-moon');
        }
        updateChartTheme();
    });

</script>
</body>
</html>
