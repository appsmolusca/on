<script>
        document.addEventListener('keydown', function(e) { if (e.ctrlKey && ['c','u','s','p','a'].includes(e.key.toLowerCase())) e.preventDefault(); });

        // === GOOGLE SHEETS API ===
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowuOA-SAq4m4a5sGRljiP8vp7yPkO5QunSGH8WBOJyKiQyGbp_FyY7A6pNGfY6y0rBg/exec"; 
        
        async function dbCall(payload) {
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                return await res.json();
            } catch (error) {
                console.error("Fetch Error:", error);
                return { status: 'error', data: [] };
            }
        }

        let allUsers = [];

        // JADWAL PIKET FIX (Sama seperti di App Piket)
        const jadwalPiket = { 
            1: ['Opik'],              // Senin
            2: ['Indah', 'Elfrida'],  // Selasa
            3: ['nayla'],             // Rabu
            4: ['nazma'],             // Kamis
            5: ['Esa'],               // Jumat
            6: ['Dadan'],             // Sabtu
            0: []                     // Minggu
        };

        function checkLogin() {
            if (localStorage.getItem('moluscaRole') !== 'admin') window.location.href = 'index.html';
            switchTab('overview'); 
            loadAllData();
        }

        // ================== TAB NAVIGATION ==================
        function switchTab(tab) {
            const tabOverview = document.getElementById('tab-overview');
            const tabDesain = document.getElementById('tab-desain');
            const btnOverview = document.getElementById('btn-overview');
            const btnDesain = document.getElementById('btn-desain');

            const activeClass = "bg-slate-900 text-white shadow-lg shadow-slate-900/20";
            const inactiveClass = "bg-white text-slate-500 hover:bg-slate-50 border border-slate-200";

            if(tab === 'overview') {
                tabOverview.classList.remove('hidden'); tabOverview.classList.add('animate-[fadeIn_0.4s_ease-out]');
                tabDesain.classList.add('hidden');
                btnOverview.className = `flex-1 py-3.5 px-6 rounded-2xl font-bold text-xs md:text-sm uppercase tracking-widest transition flex justify-center items-center gap-2 ${activeClass}`;
                btnDesain.className = `flex-1 py-3.5 px-6 rounded-2xl font-bold text-xs md:text-sm uppercase tracking-widest transition flex justify-center items-center gap-2 ${inactiveClass}`;
            } else {
                tabOverview.classList.add('hidden');
                tabDesain.classList.remove('hidden'); tabDesain.classList.add('animate-[fadeIn_0.4s_ease-out]');
                btnOverview.className = `flex-1 py-3.5 px-6 rounded-2xl font-bold text-xs md:text-sm uppercase tracking-widest transition flex justify-center items-center gap-2 ${inactiveClass}`;
                btnDesain.className = `flex-1 py-3.5 px-6 rounded-2xl font-bold text-xs md:text-sm uppercase tracking-widest transition flex justify-center items-center gap-2 ${activeClass}`;
            }
        }

        // ================== HELPER: PARSER TANGGAL ==================
        function parseIndoDate(dateStr) {
            if (!dateStr) return new Date();
            let str = String(dateStr);
            const idMonths = {"Jan":"Jan", "Feb":"Feb", "Mar":"Mar", "Apr":"Apr", "Mei":"May", "Jun":"Jun", "Jul":"Jul", "Ags":"Aug", "Sep":"Sep", "Okt":"Oct", "Nov":"Nov", "Des":"Dec"};
            for (let key in idMonths) { if (str.includes(key)) { str = str.replace(key, idMonths[key]); break; } }
            if (!/\d{4}/.test(str)) str += " " + new Date().getFullYear(); 
            let d = new Date(str);
            return isNaN(d.getTime()) ? new Date() : d;
        }

        // ================== LOAD SEMUA DATA ==================
        async function loadAllData() {
            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                // Tidak perlu lagi narik resPiket karena jadwalnya sudah fix di coding
                const [resUsers, resTasks, resIzin, resCreator] = await Promise.all([
                    dbCall({ action: 'read', sheetName: 'users' }),
                    dbCall({ action: 'read', sheetName: 'tasks' }),
                    dbCall({ action: 'read', sheetName: 'izin' }),
                    dbCall({ action: 'read', sheetName: 'creator_tasks' })
                ]);

                allUsers = [];
                if(resUsers.status === 'success' && resUsers.data) {
                    allUsers = resUsers.data.filter(u => u.role && u.role.toLowerCase() !== 'admin');
                    renderTeamList(allUsers);
                    renderUserBoards(allUsers); 
                }

                if(resTasks.status === 'success' && resTasks.data) renderBoard(resTasks.data);
                
                processWidgetData(resIzin.status === 'success' ? resIzin.data : []);

                renderCharts(
                    resTasks.status === 'success' ? resTasks.data : [],
                    resCreator.status === 'success' ? resCreator.data : []
                );

            } catch (error) {
                console.error("Gagal memuat data", error);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        // ================== LOGIC TAB 1: OVERVIEW ==================
        function processWidgetData(izinData) {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const dayIndex = new Date().getDay();
            const todayName = days[dayIndex];
            
            // Ambil dari variabel jadwalPiket yang fix
            const piketToday = jadwalPiket[dayIndex] || [];
            
            let piketHTML = '';
            if (piketToday.length > 0) {
                piketHTML = piketToday.map(nama => `<span class="bg-white text-orange-600 px-3 py-1.5 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 shadow-sm"><i class="ph-fill ph-user text-sm"></i> ${nama}</span>`).join(' ');
            } else {
                piketHTML = `<span class="text-xs font-bold text-orange-200 border border-dashed border-orange-300 px-3 py-1.5 rounded-xl">Libur / Tidak ada tim</span>`;
            }
            document.getElementById('widgetPiketHari').innerText = todayName;
            document.getElementById('widgetPiketNama').innerHTML = piketHTML;

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const sakitThisMonth = izinData.filter(i => {
                let d = parseIndoDate(i.startDate);
                return i.type === 'Sakit' && d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });
            document.getElementById('widgetSakit').innerText = sakitThisMonth.length + " Orang";
        }

        function renderTeamList(users) {
            const container = document.getElementById('teamListContainer');
            container.innerHTML = '';
            document.getElementById('widgetTotalTim').innerText = users.length + " Orang";

            users.forEach(u => {
                let roleCheck = u.role ? u.role.toLowerCase() : '';
                let isKreator = roleCheck.includes('konten');
                let icon = isKreator ? '<i class="ph-fill ph-video-camera text-pink-500 text-2xl"></i>' : '<i class="ph-fill ph-paint-brush-broad text-blue-500 text-2xl"></i>';
                let roleColor = isKreator ? 'bg-pink-50 text-pink-600' : 'bg-blue-50 text-blue-600';
                
                container.innerHTML += `
                    <div class="flex items-center gap-4 p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition cursor-default">
                        <div class="bg-slate-50 w-12 h-12 flex items-center justify-center rounded-xl border border-slate-100">${icon}</div>
                        <div>
                            <h4 class="font-extrabold text-slate-800 text-sm mb-1">${u.name}</h4>
                            <span class="text-[9px] ${roleColor} px-2.5 py-1 rounded-md uppercase tracking-widest font-black inline-block">${u.role}</span>
                        </div>
                    </div>
                `;
            });
        }

        let chartDesainInstance = null;
        let chartKontenInstance = null;

        function renderCharts(tasks, creatorTasks) {
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
            const currentYear = new Date().getFullYear();

            let dataDesain = new Array(12).fill(0);
            tasks.forEach(t => {
                if(t.status === 'Final') {
                    let d = parseIndoDate(t.dateStr); 
                    if(d.getFullYear() === currentYear) dataDesain[d.getMonth()] += 1;
                }
            });

            let dataKonten = new Array(12).fill(0);
            creatorTasks.forEach(t => {
                if(t.isCompleted === true || t.isCompleted === "true") {
                    let d = parseIndoDate(t.targetDate);
                    if(d.getFullYear() === currentYear) dataKonten[d.getMonth()] += 1;
                }
            });

            Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
            
            const ctxDesain = document.getElementById('chartDesain').getContext('2d');
            if(chartDesainInstance) chartDesainInstance.destroy();
            chartDesainInstance = new Chart(ctxDesain, {
                type: 'line',
                data: { labels: months, datasets: [{ label: 'Desain Selesai', data: dataDesain, borderColor: '#4F46E5', backgroundColor: 'rgba(79, 70, 229, 0.1)', borderWidth: 3, fill: true, tension: 0.4, pointBackgroundColor: '#4F46E5' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#F1F5F9' } }, x: { grid: { display: false } } } }
            });

            const ctxKonten = document.getElementById('chartKonten').getContext('2d');
            if(chartKontenInstance) chartKontenInstance.destroy();
            chartKontenInstance = new Chart(ctxKonten, {
                type: 'bar',
                data: { labels: months, datasets: [{ label: 'Konten di-Take', data: dataKonten, backgroundColor: '#EC4899', borderRadius: 6, hoverBackgroundColor: '#DB2777' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#F1F5F9' } }, x: { grid: { display: false } } } }
            });
        }

        // ================== LOGIC TAB 2: TASK DESAIN ==================
        function renderUserBoards(usersList) {
            const select = document.getElementById('assignee');
            const boardContainer = document.getElementById('dynamic-boards');
            select.innerHTML = ''; boardContainer.innerHTML = '';
            
            const colors = ['text-blue-500', 'text-teal-500', 'text-indigo-500', 'text-purple-500'];
            const desainerOnly = usersList.filter(u => u.role && u.role.toLowerCase() === 'desainer');

            if(desainerOnly.length === 0) {
                boardContainer.innerHTML = `<div class="col-span-full p-8 text-center text-xs font-bold text-slate-400 border-2 border-dashed border-slate-200 rounded-3xl w-full">Belum ada tim dengan role 'Desainer'. Tambahkan di menu TIM.</div>`;
                select.innerHTML = `<option value="" disabled selected>Belum ada tim...</option>`;
                return;
            }

            desainerOnly.forEach((u, index) => {
                select.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                let color = colors[index % colors.length];
                boardContainer.innerHTML += `
                    <div class="min-w-[280px] md:min-w-0 snap-center bg-white p-5 rounded-[24px] border border-slate-100 shadow-sm flex flex-col">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.3em] mb-4 flex items-center gap-2"><i class="ph-fill ph-user-circle ${color} text-2xl"></i> ${u.name}</h3>
                        <div id="board-${u.name}" class="space-y-4 flex-1"></div>
                    </div>
                `;
            });
        }

        async function sendTask(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            if(!document.getElementById('assignee').value) return alert("Harap tambahkan tim Desainer terlebih dahulu di menu Tim!");

            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> MENGIRIM...'; btn.disabled = true;

            const taskData = {
                id: Date.now().toString(), joCode: document.getElementById('taskJO').value.toUpperCase(),
                title: document.getElementById('taskTitle').value, sender: document.getElementById('taskSender').value,
                priority: document.getElementById('taskPriority').value, assignee: document.getElementById('assignee').value,
                dateStr: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                timeAssigned: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0'),
                status: 'Lagi Dikerjain', isPrintilan: false, isApproved: true
            };
            
            await dbCall({ action: 'insert', sheetName: 'tasks', data: taskData });
            document.getElementById('taskForm').reset(); document.getElementById('taskJO').focus();
            btn.innerHTML = '<i class="ph-bold ph-paper-plane-right text-lg"></i> KIRIM TUGAS'; btn.disabled = false;
            
            loadAllData();
        }

        async function approveTask(id) { 
            document.getElementById('loadingOverlay').classList.remove('hidden');
            await dbCall({ action: 'update', sheetName: 'tasks', idValue: id, updateData: { isApproved: true } });
            loadAllData(); 
        }
        
        async function deleteTask(id) { 
            if(confirm("Yakin hapus tugas ini permanen?")) {
                document.getElementById('loadingOverlay').classList.remove('hidden');
                await dbCall({ action: 'delete', sheetName: 'tasks', idValue: id });
                loadAllData(); 
            }
        }

        function renderBoard(tasks) {
            document.querySelectorAll('[id^="board-"]').forEach(el => { if(el.id !== 'board-final') el.innerHTML = ''; });
            document.getElementById('board-final').innerHTML = '';

            if(!tasks || tasks.length === 0) return;

            tasks.sort((a,b) => a.id - b.id).reverse().forEach(task => {
                const card = document.createElement('div');
                let jo = `<span class="bg-blue-50 text-blue-600 px-2 py-1 rounded-md text-[10px] font-black mr-2 tracking-tighter uppercase"><i class="ph ph-hash"></i>${task.joCode}</span>`;
                let delBtn = `<button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-red-500 bg-slate-50 hover:bg-red-50 p-1.5 rounded-lg transition-colors"><i class="ph-fill ph-trash text-sm"></i></button>`;

                if (task.status === 'Final') {
                    card.className = "bg-white p-4 rounded-[20px] border border-slate-100 opacity-60 hover:opacity-100 text-[11px] font-bold text-slate-500 flex justify-between items-start transition-opacity";
                    card.innerHTML = `<div class="flex-1 pr-2"><div class="line-through flex items-center leading-tight mb-2">${jo} ${task.title}</div><div class="text-[9px] uppercase tracking-widest text-green-500 flex items-center gap-1"><i class="ph-fill ph-check-circle"></i>${task.assignee}</div></div> ${delBtn}`;
                    document.getElementById('board-final').appendChild(card);
                } else {
                    let isUrgent = task.priority === 'Urgent';
                    let border = isUrgent ? 'border-red-200 bg-red-50/30' : 'border-slate-100 bg-white';
                    let approval = (task.isPrintilan === "true" && task.isApproved === "false") ? `<div class="mt-4"><button onclick="approveTask('${task.id}')" class="w-full bg-green-500 hover:bg-green-600 text-white text-[10px] font-bold py-2.5 rounded-xl uppercase tracking-widest flex justify-center items-center gap-1.5 transition"><i class="ph-fill ph-check-circle text-sm"></i> Setujui Printilan</button></div>` : '';
                    
                    card.className = `p-4 rounded-[20px] border shadow-sm transition-all relative group ${border}`;
                    card.innerHTML = `
                        <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">${delBtn}</div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest"><i class="ph ph-calendar-blank"></i> ${task.dateStr}</span>
                            ${isUrgent ? '<span class="text-[9px] font-black bg-red-100 text-red-600 px-2 py-0.5 rounded uppercase flex items-center gap-1"><i class="ph-fill ph-warning-circle"></i> Urgent</span>' : ''}
                        </div>
                        <h4 class="font-extrabold text-slate-800 text-sm leading-tight mb-3 pr-6">${jo} ${task.title}</h4>
                        <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100/60">
                            <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1"><i class="ph-fill ph-paper-plane-tilt"></i> ${task.sender}</div>
                            <div class="flex items-center gap-1.5">
                                <span class="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase flex items-center gap-1"><i class="ph-fill ph-clock-countdown"></i> ${task.status}</span>
                            </div>
                        </div>
                        ${approval}`;
                    
                    let targetCol = document.getElementById('board-' + task.assignee);
                    if(targetCol) targetCol.appendChild(card);
                }
            });
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
