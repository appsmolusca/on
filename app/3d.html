<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace - Molusca Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        tailwind.config = {
            theme: {
                extend: {

<body class="pb-24" onload="initApp()" oncontextmenu="return false;">

    <main class="p-4 max-w-4xl mx-auto mt-2 md:mt-6 space-y-8">

                    <button type="submit" id="btnSubmit" class="bg-blue-600 text-white px-6 py-3 rounded-xl text-xs font-extrabold uppercase flex justify-center items-center gap-2 hover:bg-blue-700 active:scale-[0.98] transition-all shadow-sm">Kirim <i class="ph-bold ph-paper-plane-right"></i></button>

            </section>

        <!-- WRAPPER 3D DESIGN (Teguh, Zalfa, Tester3D) -->

            <!-- FORM INPUT DADAKAN 3D -->

                    <form id="formManual3d" onsubmit="sendManualTask3d(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        </div>

                                </div>
                                <input type="hidden" id="m3dMesin" value="">
                            </div>
                        </div>

                        <div class="md:col-span-2 mt-2"><button type="submit" id="btnManual3d" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-xl text-xs md:text-sm font-extrabold uppercase tracking-widest flex justify-center items-center gap-2 active:scale-[0.98] transition-all shadow-md">Simpan Tugas <i class="ph-bold ph-paper-plane-right text-lg"></i></button></div>
                    </form>
                </div>
            </section>

            <!-- BOARD ACTIVE 3D -->
            <div>
                <div class="flex items-center justify-between mb-4 ml-1">
                    <h3 class="text-sm md:text-base font-extrabold text-slate-700 uppercase tracking-widest flex items-center gap-2">
                        <i class="ph-fill ph-kanban text-emerald-500 text-xl"></i> Tugas 3D Kamu
                    </h3>
                    <span id="syncStatus3d" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-md flex items-center gap-1 border border-slate-200">
                        <i class="ph-bold ph-arrows-clockwise animate-spin"></i> Sync...

                <div id="final-list-3d" class="space-y-3 grid grid-cols-1 md:grid-cols-2 gap-3 md:space-y-0"></div>

    <!-- MODAL UPDATE PROGRESS 3D -->
    <div id="modalUpdate3d" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-center items-end md:items-center">
        <div class="bg-white w-full md:w-[500px] rounded-t-[32px] md:rounded-[32px] p-6 shadow-2xl transform transition-transform duration-300 translate-y-full md:translate-y-0 overflow-y-auto max-h-[90vh]" id="modalBox3d">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-lg font-extrabold text-slate-800">Update Progress</h3>
                    <p class="text-xs text-slate-500 mt-1 font-medium truncate w-64" id="modalProjectName">Nama Project...</p>
                </div>
                <button onclick="closeModal3d()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-red-100 hover:text-red-500 transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
            </div>

            <form id="formUpdate3d" onsubmit="saveUpdate3d(event)" class="space-y-4">
                <input type="hidden" id="updId">
                
                <div class="relative"><i class="ph-bold ph-info absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select id="updStatus" onchange="toggleMesin('updStatus', 'updMesinContainer', 'updMesin')" required class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm font-semibold outline-none cursor-pointer focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100 appearance-none text-blue-700">

                        <option value="Lagi Dikerjain">✍️ Lagi Dikerjain (Desain)</option>
                        <option value="Nunggu Revisi">🔄 Nunggu Revisi</option>
                        <option value="Lagi Produksi">⚙️ Lagi Produksi (Cetak)</option>
                        <option value="Mesin Jalan Project">🚀 Mesin Jalan Project</option>
                        <option value="Selesai">✅ Selesai</option>
                    </select>
                    <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="relative"><i class="ph-bold ph-clock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="text" id="updStart" readonly placeholder="Jam Mulai (Otomatis)" autocomplete="off" class="w-full bg-slate-200 text-slate-500 cursor-not-allowed border border-slate-200 rounded-xl py-3.5 pl-11 pr-3 text-sm font-semibold outline-none"></div>
                    <div class="relative"><i class="ph-bold ph-clock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="text" id="updEnd" placeholder="Jam Selesai (Opsional)" autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-3 text-sm font-semibold focus:border-emerald-400 outline-none"></div>
                </div>

                <div id="updMesinContainer" class="hidden space-y-4 p-4 bg-emerald-50 rounded-[20px] border border-emerald-100">
                    <div class="relative">
                        <p class="text-[11px] font-bold text-emerald-700 mb-2 flex items-center gap-1"><i class="ph-bold ph-cpu"></i> Pilih Mesin (Bisa lebih dari 1):</p>
                        <div id="updMesinGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2"></div>
                        <input type="hidden" id="updMesin" value="">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative"><i class="ph-bold ph-scales absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="text" id="updGramasi" placeholder="Gramasi" class="w-full bg-white border border-emerald-200 rounded-xl py-3 pl-11 pr-3 text-sm font-semibold outline-none"></div>

                    </div>
                </div>

                <div class="relative"><i class="ph-bold ph-note-pencil absolute left-4 top-4 text-slate-400"></i>
                    <textarea id="updCatatanTim" placeholder="Catatan progress untuk admin..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm font-medium focus:border-emerald-400 outline-none min-h-[80px] resize-none"></textarea>
                </div>

                <button type="submit" id="btnUpdate3d" class="w-full bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-xl text-sm font-extrabold uppercase tracking-widest flex justify-center items-center gap-2 mt-4 transition-colors">Update Data <i class="ph-bold ph-check-circle text-lg"></i></button>
            </form>
        </div>

    <script>
        // PASTIKAN SCRIPT URL INI SAMA DENGAN ADMIN DASHBOARD
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowuOA-SAq4m4a5sGRljiP8vp7yPkO5QunSGH8WBOJyKiQyGbp_FyY7A6pNGfY6y0rBg/exec";
        const SPREADSHEET_ID = '1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI';

        let currentUser = localStorage.getItem('moluscaUser');
        let currentRole = localStorage.getItem('moluscaRole');
        
        let myTasksGlobal = []; 
        let myTasks3dGlobal = []; 

        const daftarMesin = [
            "Mesin A1.1", "Mesin A1.2", "Mesin A1.3", "Mesin A1.4", "Mesin A1.5", 
            "Mesin A1.6", "Mesin A1.7", "Mesin A1.8", "Mesin A1.9", "Mesin A1.10", 
            "Mesin A1.11", "Mesin A2.1", "Mesin A2.2", "Mesin C1.1"
        ];
        
        function initApp() {
            if(!currentUser || currentRole === 'admin') return window.location.href = 'index.html';
            document.getElementById('userName').innerText = currentUser;
            
            // Catat Waktu Login (Hanya ditembak 1x per sesi)
            if(!sessionStorage.getItem('login_recorded')) {
                dbCall({ action: 'log_event', data: { id: Date.now(), nama: currentUser, aktivitas: 'Login ke Workspace' } });
                sessionStorage.setItem('login_recorded', 'true');
            }

            if(currentRole === '3ddesign') {
                document.getElementById('wrapper-desain-3d').classList.remove('hidden');
                renderMesinChips('m3dMesinGrid', 'm3dMesin');
                renderMesinChips('updMesinGrid', 'updMesin');
                loadMyTasks3dFast();
            } else {
                document.getElementById('wrapper-desain-reguler').classList.remove('hidden');
                loadMyTasksFast(); 
            }
        }

        // FUNGSI PANGGIL API (Anti CORS Error)
        async function dbCall(payload) {
            try {
                const res = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain' }, // Wajib text/plain
                    body: JSON.stringify(payload) 
                });
                return await res.json();
            } catch(e) { return { status: 'error' }; }
        }

        // FUNGSI LOGOUT (Mencatat Waktu Logout ke GS)
        async function handleLogout() {
            const btn = document.getElementById('btnLogout');
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i> Proses...';
            
            await dbCall({ action: 'log_event', data: { id: Date.now(), nama: currentUser, aktivitas: 'Logout dari Workspace' } });
            
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ==========================================
        // MULTI-SELECT CHIPS LOGIC
        // ==========================================
        function renderMesinChips(containerId, inputId) {
            const container = document.getElementById(containerId);
            container.innerHTML = daftarMesin.map(m => `
                <button type="button" onclick="toggleChip(this, '${inputId}', '${m}')" class="mesin-chip border border-emerald-200 text-emerald-700 bg-white rounded-lg py-2 px-1 text-[10px] font-bold transition-all hover:bg-emerald-100 active:scale-95 text-center truncate">
                    ${m}
                </button>
            `).join('');
        }

        function toggleChip(btn, inputId, value) {
            const input = document.getElementById(inputId);
            let currentValues = input.value ? input.value.split(', ') : [];
            if (currentValues.includes(value)) {
                currentValues = currentValues.filter(v => v !== value);
                btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600', 'shadow-md');
                btn.classList.add('bg-white', 'text-emerald-700', 'border-emerald-200');
            } else {
                currentValues.push(value);
                btn.classList.remove('bg-white', 'text-emerald-700', 'border-emerald-200');
                btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600', 'shadow-md');
            }
            input.value = currentValues.join(', ');
        }

        function setChipsFromValue(containerId, inputId, valueStr) {
            const input = document.getElementById(inputId);
            input.value = (valueStr === '-' || !valueStr) ? '' : valueStr;
            const values = input.value ? input.value.split(', ') : [];
            const buttons = document.getElementById(containerId).querySelectorAll('.mesin-chip');
            buttons.forEach(btn => {
                const m = btn.innerText.trim();
                if (values.includes(m)) {
                    btn.classList.remove('bg-white', 'text-emerald-700', 'border-emerald-200');
                    btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600', 'shadow-md');
                } else {
                    btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600', 'shadow-md');
                    btn.classList.add('bg-white', 'text-emerald-700', 'border-emerald-200');
                }
            });
        }

        function toggleMesin(statusId, containerId, mesinId) {
            const status = document.getElementById(statusId).value;
            const container = document.getElementById(containerId);
            if(status === 'Lagi Produksi' || status === 'Mesin Jalan Project' || status === 'Selesai') container.classList.remove('hidden');
            else container.classList.add('hidden');
        }

        // ==========================================
        // LOGIC KHUSUS 3D DESIGN
        // ==========================================
        async function loadMyTasks3dFast() {
            document.getElementById('syncStatus3d').innerHTML = '<i class="ph-bold ph-arrows-clockwise animate-spin"></i> Sync...';
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=tasks_3d&t=${Date.now()}`;
            try {
                const response = await fetch(url, { cache: "no-store" });
                const text = await response.text();
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);
                const cols = data.table.cols.map(c => c ? c.label : '').map(l => l.trim());
                
                let tasks = data.table.rows.map(r => {
                    let row = {};
                    r.c.forEach((c, i) => { if(cols[i]) row[cols[i]] = c ? (c.f !== undefined ? c.f : c.v) : ''; });
                    row.id = row.id || Date.now().toString(); return row;
                });

                myTasks3dGlobal = tasks.filter(t => t.assignee && t.assignee.toLowerCase() === currentUser.toLowerCase());
                renderTasks3d(myTasks3dGlobal);
                document.getElementById('syncStatus3d').innerHTML = '<i class="ph-bold ph-check text-emerald-500"></i> Updated';
            } catch(e) { document.getElementById('syncStatus3d').innerHTML = '<i class="ph-bold ph-warning text-red-500"></i> Fail'; }
        }

        function renderTasks3d(myTasks) {
            const active = document.getElementById('active-list-3d'); 
            const final = document.getElementById('final-list-3d');
            active.innerHTML = ''; final.innerHTML = '';

            myTasks.sort((a,b) => parseInt(a.id) - parseInt(b.id)).reverse().forEach(task => {
                const card = document.createElement('div');
                let isUrgent = task.priority === 'Urgent';
                let urgentUI = isUrgent ? `<span class="text-[10px] font-extrabold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded uppercase flex items-center gap-1">Urgent</span>` : '';

                if(task.status === 'Selesai') {
                    let detailSelesai = '';
                    if (task.startTime && task.startTime !== '-') detailSelesai += `<span class="text-blue-500 mr-2"><i class="ph-fill ph-clock"></i> ${task.startTime}-${task.endTime||''}</span>`;
                    if (task.gramasi && task.gramasi !== '-') detailSelesai += `<span class="text-amber-500">${task.gramasi}gr</span>`;
                    if (task.mesin && task.mesin !== '-') detailSelesai += `<span class="text-slate-300 mx-1">|</span><span class="text-emerald-500 truncate inline-block max-w-[100px]">${task.mesin}</span>`;

                    card.className = "bg-white p-4 rounded-xl border border-borderLight flex justify-between items-center text-xs font-bold transition-all opacity-70 hover:opacity-100";
                    card.innerHTML = `
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-slate-600 truncate font-extrabold line-through text-[13px]">${task.projectName}</span>
                            ${detailSelesai ? `<div class="text-[9px] font-bold flex items-center mt-1">${detailSelesai}</div>` : ''}
                        </div> 
                        <span class="text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-200 px-2.5 py-1 rounded-md uppercase flex items-center gap-1 shrink-0"><i class="ph-bold ph-check-circle"></i> Done</span>
                    `;
                    final.appendChild(card);
                } else {
                    let statusUI = ''; let borderUI = 'border-slate-200'; let bgUI = 'bg-surface hover:border-emerald-300';
                    let hasDetails = (task.startTime && task.startTime !== '-') || (task.mesin && task.mesin !== '-') || (task.waktuMesinJalan && task.waktuMesinJalan !== '-');
                    let detailsBlock = '';

                    if(task.status === 'Menunggu Respon') statusUI = `<span class="text-[10px] font-bold text-blue-600 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-lg flex items-center gap-1"><i class="ph-bold ph-clock-countdown"></i> Menunggu Respon</span>`;
                    else if (task.status === 'Lagi Produksi') { borderUI = 'border-amber-200 ring-2 ring-amber-50'; statusUI = `<span class="text-[10px] font-extrabold text-amber-700 bg-amber-100 border border-amber-300 px-2.5 py-1 rounded-lg flex items-center gap-1"><i class="ph-bold ph-gear-six animate-spin-slow"></i> Lagi Produksi</span>`; } 
                    else if (task.status === 'Mesin Jalan Project') { borderUI = 'border-rose-200 ring-2 ring-rose-50'; statusUI = `<span class="text-[10px] font-extrabold text-rose-700 bg-rose-100 border border-rose-300 px-2.5 py-1 rounded-lg flex items-center gap-1"><i class="ph-bold ph-rocket"></i> Mesin Jalan</span>`; } 
                    else { borderUI = 'border-purple-200 ring-2 ring-purple-50'; let icon = task.status === 'Lagi Dikerjain' ? 'ph-pen-nib' : 'ph-arrows-clockwise'; statusUI = `<span class="text-[10px] font-extrabold text-purple-700 bg-purple-100 border border-purple-300 px-2.5 py-1 rounded-lg flex items-center gap-1"><i class="ph-bold ${icon}"></i> ${task.status}</span>`; }

                    if(hasDetails) {
                        detailsBlock = `<div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-y-2 text-[11px] font-semibold text-slate-500">`;
                        if(task.startTime && task.startTime !== '-') detailsBlock += `<div class="flex items-center gap-1.5"><i class="ph-fill ph-clock"></i> ${task.startTime}-${task.endTime||''}</div>`;
                        if(task.jumlah && task.jumlah !== '-') detailsBlock += `<div class="flex items-center gap-1.5"><i class="ph-fill ph-package"></i> Qty: ${task.jumlah}</div>`;
                        if(task.mesin && task.mesin !== '-') detailsBlock += `<div class="col-span-2 flex items-start gap-1.5 text-emerald-600 font-bold"><i class="ph-fill ph-cpu mt-0.5"></i> <span class="leading-snug">${task.mesin}</span></div>`;
                        if(task.waktuMesinJalan && task.waktuMesinJalan !== '-') detailsBlock += `<div class="col-span-2 flex items-center gap-1.5 text-rose-600 font-bold mt-1"><i class="ph-fill ph-timer"></i> Mulai Mesin: ${task.waktuMesinJalan}</div>`;
                        detailsBlock += `</div>`;
                    }

                    card.className = `p-5 md:p-6 rounded-[24px] shadow-sm border transition-all ${bgUI} ${borderUI}`;
                    card.innerHTML = `
                        <div class="flex flex-wrap gap-2 items-center mb-3">${statusUI} ${urgentUI}</div>
                        <h4 class="font-extrabold text-[15px] md:text-lg leading-snug text-textMain">${task.projectName}</h4>
                        ${task.catatanAdmin && task.catatanAdmin !== '-' ? `<p class="text-[11px] md:text-xs text-slate-500 mt-2 line-clamp-2 border-l-2 border-slate-300 pl-2">"${task.catatanAdmin}"</p>` : ''}
                        ${detailsBlock}
                        <button onclick="openModal3d('${task.id}')" class="mt-5 w-full bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 border border-slate-200 hover:border-emerald-200 py-3 rounded-xl text-xs font-bold uppercase tracking-widest transition-colors flex justify-center items-center gap-2">Update Progress <i class="ph-bold ph-pencil-simple text-sm"></i></button>
                    `;
                    active.appendChild(card);
                }
            });

            if(active.innerHTML === '') active.innerHTML = `<div class="p-8 bg-slate-50 border border-slate-100 rounded-[20px] text-center"><i class="ph-fill ph-check-circle text-5xl text-emerald-300 mb-2"></i><p class="text-sm font-extrabold text-slate-700">Kerjaan Kosong!</p></div>`;
            if(final.innerHTML === '') final.innerHTML = `<p class="text-xs text-slate-400 italic ml-1">Belum ada tugas 3D yang selesai.</p>`;
        }

        function openModal3d(id) {
            const task = myTasks3dGlobal.find(t => t.id === id);
            if(!task) return;
            document.getElementById('updId').value = task.id;
            document.getElementById('modalProjectName').innerText = task.projectName;
            document.getElementById('updStatus').value = task.status || 'Menunggu Respon';
            
            const currentTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('updStart').value = (task.startTime && task.startTime !== '-') ? task.startTime : currentTime;
            document.getElementById('updEnd').value = task.endTime !== '-' ? task.endTime : '';
            document.getElementById('updGramasi').value = task.gramasi !== '-' ? task.gramasi : '';
            document.getElementById('updJumlah').value = task.jumlah !== '-' ? task.jumlah : '';
            document.getElementById('updCatatanTim').value = task.catatanTim !== '-' ? task.catatanTim : '';

            setChipsFromValue('updMesinGrid', 'updMesin', task.mesin);
            toggleMesin('updStatus', 'updMesinContainer', 'updMesin');

            const modal = document.getElementById('modalUpdate3d');
            const box = document.getElementById('modalBox3d');
            modal.classList.remove('hidden');
            setTimeout(() => box.classList.remove('translate-y-full'), 10);
        }

        function closeModal3d() {
            const box = document.getElementById('modalBox3d');
            box.classList.add('translate-y-full');
            setTimeout(() => document.getElementById('modalUpdate3d').classList.add('hidden'), 300);
        }

        async function saveUpdate3d(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUpdate3d');
            const status = document.getElementById('updStatus').value;
            const mesinVal = document.getElementById('updMesin').value;

            if ((status === 'Lagi Produksi' || status === 'Mesin Jalan Project') && mesinVal === '') {
                alert('Harap pilih minimal 1 mesin yang berjalan!'); return;
            }

            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Menyimpan...'; btn.disabled = true;
            const id = document.getElementById('updId').value;
            const currentTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const oldTask = myTasks3dGlobal.find(t => t.id === id) || {};
            
            const getValue = (inputId, oldKey) => {
                const val = document.getElementById(inputId).value.trim();
                if (val && val !== '') return val;
                if (oldTask[oldKey] && oldTask[oldKey] !== '-') return oldTask[oldKey];
                return '-';
            };

            let updateData = {
                status: status, startTime: getValue('updStart', 'startTime'), endTime: getValue('updEnd', 'endTime'),
                catatanTim: getValue('updCatatanTim', 'catatanTim'), mesin: getValue('updMesin', 'mesin'),
                gramasi: getValue('updGramasi', 'gramasi'), jumlah: getValue('updJumlah', 'jumlah'),
                waktuMesinJalan: status === 'Mesin Jalan Project' ? currentTime : (oldTask.waktuMesinJalan && oldTask.waktuMesinJalan !== '-' ? oldTask.waktuMesinJalan : '-')
            };

            await dbCall({ action: 'update', sheetName: 'tasks_3d', idValue: id, updateData: updateData });
            btn.innerHTML = 'Update Data <i class="ph-bold ph-check-circle text-lg"></i>'; btn.disabled = false;
            closeModal3d(); setTimeout(() => { loadMyTasks3dFast(); }, 500);
        }

        async function sendManualTask3d(e) {
            e.preventDefault();
            const btn = document.getElementById('btnManual3d');
            const status = document.getElementById('m3dStatus').value;
            const mesinVal = document.getElementById('m3dMesin').value;
            const isMesinActive = (status === 'Lagi Produksi' || status === 'Mesin Jalan Project' || status === 'Selesai');

            if (isMesinActive && mesinVal === '') { alert('Harap pilih minimal 1 mesin!'); return; }

            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-lg"></i>'; btn.disabled = true;
            const currentTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const data = {
                id: Date.now().toString(), assignee: currentUser, projectName: document.getElementById('m3dProject').value, 
                priority: 'Normal', catatanAdmin: 'TUGAS EXTRA', status: status, 
                startTime: currentTime, endTime: document.getElementById('m3dEnd').value || '-', 
                catatanTim: '-', gramasi: '-', jumlah: '-', mesin: isMesinActive ? (mesinVal || '-') : '-',
                waktuMesinJalan: status === 'Mesin Jalan Project' ? currentTime : '-'
            };
            
            await dbCall({ action: 'insert', sheetName: 'tasks_3d', data: data });
            document.getElementById('formManual3d').reset();
            setChipsFromValue('m3dMesinGrid', 'm3dMesin', ''); toggleMesin('m3dStatus', 'm3dMesinContainer', 'm3dMesin');
            
            btn.innerHTML = 'Simpan Tugas <i class="ph-bold ph-paper-plane-right text-lg"></i>'; btn.disabled = false;
            setTimeout(() => { loadMyTasks3dFast(); }, 500);
        }

        // Logic Desain Reguler Sengaja diringkas (bisa dikopikan dari atas)
    </script>
</body>
</html>
