<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Molusca Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #838383; font-family: 'Plus Jakarta Sans', sans-serif; } /* Warna bg abu gelap sesuai gambar */
        
        /* Gradien garis atas pada card login */
        .gradient-top {
            background: linear-gradient(90deg, #1d4ed8 0%, #7e22ce 50%, #ea580c 100%);
            height: 6px;
            width: 100%;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Login -->
    <div class="relative bg-[#ebebeb] w-full max-w-sm rounded-[24px] shadow-2xl p-8 pt-10">
        <div class="gradient-top"></div>
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="flex justify-center gap-2 mb-2 text-2xl">
                <i class="ph-fill ph-hexagon text-blue-700"></i>
                <i class="ph-fill ph-folder text-indigo-600"></i>
                <i class="ph-fill ph-wallet text-orange-500"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Molusca<span class="text-blue-600">.</span></h1>
            <p class="text-[9px] font-extrabold text-slate-500 tracking-[0.2em] uppercase mt-1">Unified Workspace System</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- Input Username -->
            <div class="relative">
                <i class="ph-fill ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="username" required placeholder="Username..." autocomplete="off" class="w-full bg-slate-200/70 border-none rounded-xl py-3.5 pl-12 pr-4 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder:font-semibold">
            </div>

            <!-- Input Password -->
            <div class="relative">
                <i class="ph-fill ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="password" id="password" required placeholder="Password..." class="w-full bg-slate-200/70 border-none rounded-xl py-3.5 pl-12 pr-4 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder:font-semibold">
            </div>

            <!-- Pesan Error -->
            <div id="errorBox" class="hidden bg-red-100 border border-red-200 text-red-600 text-[11px] font-bold p-3 rounded-lg text-center">
                Pesan Error
            </div>

            <!-- Tombol Login -->
            <button type="submit" id="btnLogin" class="w-full bg-[#0f172a] hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-xs tracking-widest uppercase mt-4 transition-all flex justify-center items-center gap-2 active:scale-95">
                Login Workspace
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // 1. MASUKKAN URL DEPLOYMENT BARU KAMU DI SINI
        // ==========================================
        const APPSCRIPT_URL = "URL_APPSCRIPT_KAMU_DISINI"; 

        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const errBox = document.getElementById('errorBox');
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();

            // Tampilan Loading
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-lg"></i> MEMERIKSA DATA...`;
            btn.disabled = true;
            errBox.classList.add('hidden');

            try {
                // Konfigurasi Payload untuk meminta data dari sheet "users"
                const payload = {
                    action: "read",
                    sheetName: "users" // PASTIKAN nama sheet di database mu adalah "users"
                };

                // Fetch dengan trik anti-CORS (text/plain & redirect: follow)
                const response = await fetch(APPSCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload),
                    redirect: "follow"
                });

                if (!response.ok) throw new Error("Gagal terhubung ke Server Google.");

                const result = await response.json();
                
                if (result.status !== "success") throw new Error(result.message);

                // Pencocokan Data User
                const users = result.data;
                const foundUser = users.find(u => 
                    u.username.toString().toLowerCase() === userIn.toLowerCase() && 
                    u.password.toString() === passIn
                );

                if (foundUser) {
                    // Simpan sesi login ke LocalStorage
                    localStorage.setItem('moluscaUser', foundUser.username);
                    localStorage.setItem('moluscaRole', foundUser.role); // misal: admin / 3ddesign / reguler

                    // Arahkan halaman sesuai Role (Tolong sesuaikan nama file HTML-nya jika berbeda)
                    if (foundUser.role.toLowerCase() === 'admin') {
                        window.location.href = 'admin.html'; // Nama file dashboard admin
                    } else {
                        window.location.href = 'desainer.html'; // Nama file workspace desainer
                    }
                } else {
                    throw new Error("Username atau Password salah!");
                }

            } catch (error) {
                console.error(error);
                errBox.innerText = error.message;
                errBox.classList.remove('hidden');
            } finally {
                // Kembalikan tombol seperti semula jika gagal
                btn.innerHTML = `Login Workspace`;
                btn.disabled = false;
            }
        }

        // Cek jika sudah login, langsung arahkan tanpa perlu login ulang
        window.onload = () => {
            const loggedUser = localStorage.getItem('moluscaUser');
            const loggedRole = localStorage.getItem('moluscaRole');
            if (loggedUser) {
                if (loggedRole === 'admin') window.location.href = 'admin.html';
                else window.location.href = 'desainer.html';
            }
        };
    </script>
</body>
</html>
