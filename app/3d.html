<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - Molusca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { 
                        neutral: { 50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4', 800: '#262626', 900: '#171717' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fafafa; color: #171717; }
        /* Custom Scrollbar minimalis */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
    </style>
</head>
<body class="min-h-screen">

    <!-- HEADER ADMIN -->
    <header class="bg-white border-b border-neutral-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-black text-white flex items-center justify-center rounded-md">
                    <i class="ph-bold ph-cube text-xl"></i>
                </div>
                <h1 class="text-sm font-extrabold tracking-widest uppercase">Admin Workspace</h1>
            </div>
            <div class="text-[11px] font-bold text-neutral-500 border border-neutral-200 px-3 py-1.5 rounded-full flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                Sistem Aktif
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- KOLOM KIRI: ASSIGN TUGAS & STATUS KARYAWAN -->
        <div class="lg:col-span-4 space-y-8">
            
            <!-- FORM ASSIGN TUGAS (BOS) -->
            <section class="bg-white border border-neutral-200 p-6 rounded-2xl shadow-sm">
                <h3 class="text-xs font-extrabold text-black uppercase tracking-widest mb-5 flex items-center gap-2 border-b border-neutral-100 pb-3">
                    <i class="ph-bold ph-paper-plane-tilt text-lg"></i> Delegasi Tugas
                </h3>
                
                <form id="formAssign" onsubmit="handleAssignTask(event)" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-1.5">Nama Project</label>
                        <input type="text" id="projectName" placeholder="Contoh: Bank BRI" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg py-2.5 px-3 text-sm font-semibold focus:border-black focus:ring-1 focus:ring-black outline-none transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-1.5">Pilih Karyawan</label>
                        <select id="assignee" required class="w-full bg-neutral-50 border border-neutral-200 rounded-lg py-2.5 px-3 text-sm font-semibold focus:border-black outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>Pilih Tim...</option>
                            <option value="Teguh">Teguh (3D)</option>
                            <option value="Zalfa">Zalfa (3D)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-1.5">Tipe Pekerjaan</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center justify-center gap-2 border border-neutral-200 bg-white py-2 rounded-lg cursor-pointer hover:bg-neutral-50 has-[:checked]:bg-black has-[:checked]:text-white has-[:checked]:border-black transition-all">
                                <input type="radio" name="jobType" value="Mockup" required class="hidden">
                                <span class="text-xs font-bold">Bikin Mockup</span>
                            </label>
                            <label class="flex items-center justify-center gap-2 border border-neutral-200 bg-white py-2 rounded-lg cursor-pointer hover:bg-neutral-50 has-[:checked]:bg-black has-[:checked]:text-white has-[:checked]:border-black transition-all">
                                <input type="radio" name="jobType" value="Produksi" class="hidden">
                                <span class="text-xs font-bold">Langsung Produksi</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-black hover:bg-neutral-800 text-white py-3 rounded-lg text-xs font-extrabold uppercase tracking-widest mt-2 active:scale-95 transition-all">
                        Tugaskan Sekarang
                    </button>
                </form>
            </section>

            <!-- STATUS KARYAWAN -->
            <section class="bg-white border border-neutral-200 p-6 rounded-2xl shadow-sm">
                <h3 class="text-xs font-extrabold text-black uppercase tracking-widest mb-5 flex items-center gap-2 border-b border-neutral-100 pb-3">
                    <i class="ph-bold ph-users text-lg"></i> Pantauan Tim
                </h3>
                <div class="space-y-4">
                    <!-- Karyawan 1 -->
                    <div class="flex items-center justify-between p-3 border border-neutral-200 rounded-xl bg-neutral-50">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-white border border-neutral-300 flex items-center justify-center font-bold text-xs">TG</div>
                            <div>
                                <h4 class="text-xs font-extrabold">Teguh</h4>
                                <p class="text-[10px] text-neutral-500 font-medium">Sedang Aktif</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-neutral-500 uppercase">Login Hari Ini</p>
                            <p class="text-xs font-extrabold text-black">08:12 WIB</p>
                        </div>
                    </div>
                    <!-- Karyawan 2 -->
                    <div class="flex items-center justify-between p-3 border border-neutral-200 rounded-xl bg-neutral-50">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-white border border-neutral-300 flex items-center justify-center font-bold text-xs">ZL</div>
                            <div>
                                <h4 class="text-xs font-extrabold">Zalfa</h4>
                                <p class="text-[10px] text-neutral-500 font-medium">Offline</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-neutral-500 uppercase">Login Terakhir</p>
                            <p class="text-xs font-extrabold text-neutral-400">Kemarin, 17:00</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- KOLOM KANAN: LIVE ACTIVITY TRACKER -->
        <div class="lg:col-span-8">
            <section class="bg-white border border-neutral-200 p-6 md:p-8 rounded-2xl shadow-sm h-full min-h-[600px] flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-neutral-100 pb-4">
                    <h3 class="text-sm font-extrabold text-black uppercase tracking-widest flex items-center gap-2">
                        <i class="ph-bold ph-activity text-xl"></i> Log Aktivitas Karyawan
                    </h3>
                    <button onclick="refreshLog()" class="text-[10px] font-bold text-neutral-600 bg-neutral-100 px-3 py-1.5 rounded-md hover:bg-neutral-200 transition-colors flex items-center gap-1">
                        <i class="ph-bold ph-arrows-clockwise"></i> Segarkan
                    </button>
                </div>
                
                <!-- TIMELINE CONTAINER -->
                <div class="flex-1 overflow-y-auto pr-2 relative" id="timelineContainer">
                    <!-- Garis vertikal timeline -->
                    <div class="absolute left-[27px] top-2 bottom-0 w-[2px] bg-neutral-100"></div>
                    
                    <!-- DAFTAR AKTIVITAS (DI-RENDER DARI JAVASCRIPT) -->
                    <div id="activityFeed" class="space-y-6 relative z-10">
                        <!-- Konten akan dimasukkan lewat fungsi renderActivityFeed() -->
                    </div>
                </div>
            </section>
        </div>

    </main>

    <script>
        // Simulasi Database Jejak Aktivitas (Bisa diganti response dari Google Sheets/Apps Script)
        let activityLogs = [
            { id: 1, time: "11:10 WIB", user: "Teguh", action: "Update Progress", detail: "Mengubah status menjadi Nunggu Revisi", project: "Bank BRI", type: "revisi" },
            { id: 2, time: "10:35 WIB", user: "Zalfa", action: "Mulai Produksi", detail: "Mesin jalan untuk project", project: "Chibi Boy", type: "produksi" },
            { id: 3, time: "09:15 WIB", user: "Teguh", action: "Mulai Pekerjaan", detail: "Mulai membuat Mockup", project: "Bank BRI", type: "mulai" },
            { id: 4, time: "09:00 WIB", user: "Admin", action: "Assign Tugas", detail: "Memberikan tugas pembuatan Mockup", project: "Bank BRI", type: "admin" },
            { id: 5, time: "08:12 WIB", user: "Teguh", action: "Login Aplikasi", detail: "Berhasil masuk ke dashboard karyawan", project: "-", type: "login" },
        ];

        function getIconForType(type) {
            switch(type) {
                case 'login': return '<i class="ph-bold ph-sign-in text-neutral-500"></i>';
                case 'admin': return '<i class="ph-bold ph-paper-plane-tilt text-black"></i>';
                case 'mulai': return '<i class="ph-bold ph-play text-black"></i>';
                case 'produksi': return '<i class="ph-bold ph-gear text-black"></i>';
                case 'revisi': return '<i class="ph-bold ph-arrows-clockwise text-black"></i>';
                default: return '<i class="ph-bold ph-check text-neutral-500"></i>';
            }
        }

        function getBadgeForType(type) {
            switch(type) {
                case 'login': return 'bg-neutral-100 text-neutral-600 border border-neutral-200';
                case 'produksi': return 'bg-black text-white';
                case 'revisi': return 'bg-white text-black border border-black';
                default: return 'bg-neutral-100 text-neutral-800';
            }
        }

        function renderActivityFeed() {
            const feed = document.getElementById('activityFeed');
            feed.innerHTML = '';

            activityLogs.forEach(log => {
                const icon = getIconForType(log.type);
                const badgeClass = getBadgeForType(log.type);
                
                const html = `
                    <div class="flex gap-4 items-start group">
                        <!-- Waktu -->
                        <div class="w-14 text-right pt-1 shrink-0">
                            <span class="text-[10px] font-extrabold text-neutral-400 group-hover:text-black transition-colors">${log.time}</span>
                        </div>
                        
                        <!-- Icon Node -->
                        <div class="w-8 h-8 rounded-full bg-white border-2 border-neutral-200 flex items-center justify-center shrink-0 z-10 group-hover:border-black transition-colors">
                            ${icon}
                        </div>
                        
                        <!-- Content Box -->
                        <div class="flex-1 bg-white border border-neutral-200 rounded-xl p-3 shadow-sm hover:shadow-md transition-all">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="text-xs font-extrabold text-black">${log.user} <span class="text-neutral-400 font-medium">/ ${log.action}</span></h4>
                                ${log.project !== '-' ? `<span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider ${badgeClass}">${log.project}</span>` : ''}
                            </div>
                            <p class="text-[11px] text-neutral-500 font-medium">${log.detail}</p>
                        </div>
                    </div>
                `;
                feed.innerHTML += html;
            });
        }

        // Simulasi saat Admin klik "Tugaskan Sekarang"
        function handleAssignTask(e) {
            e.preventDefault();
            const project = document.getElementById('projectName').value;
            const assignee = document.getElementById('assignee').value;
            const jobType = document.querySelector('input[name="jobType"]:checked').value;
            
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ' WIB';

            // Tambahkan ke log aktivitas teratas
            const newLog = {
                id: Date.now(),
                time: timeString,
                user: "Admin",
                action: "Assign Tugas",
                detail: `Menugaskan ${assignee} untuk ${jobType === 'Mockup' ? 'membuat Mockup' : 'langsung Produksi'}`,
                project: project,
                type: "admin"
            };

            activityLogs.unshift(newLog); // Masukkan ke urutan pertama
            renderActivityFeed();
            
            // Reset form
            document.getElementById('formAssign').reset();
        }

        function refreshLog() {
            // Animasi loading kecil
            const feed = document.getElementById('activityFeed');
            feed.style.opacity = '0.5';
            setTimeout(() => {
                renderActivityFeed();
                feed.style.opacity = '1';
            }, 300);
        }

        // Inisialisasi awal
        window.onload = renderActivityFeed;
    </script>
</body>
</html>
